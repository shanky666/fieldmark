services:
  - type: web
    name: fieldmark-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn fieldmark.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fieldmark-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: USE_MOCK_SMS
        value: "True"

databases:
  - name: fieldmark-db
    plan: free
