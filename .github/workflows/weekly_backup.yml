name: Weekly Database Backup (Supabase to Cloudflare R2)

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at midnight UTC
  workflow_dispatch: # Allow manual triggers from GitHub Actions UI

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute pg_dump & Compress
        env:
          # Injected from Github secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }} 
        run: |
          BACKUP_DATE=$(date +%Y_%m_%d_%H%M%S)
          pg_dump "$DATABASE_URL" | gzip > db_backup_$BACKUP_DATE.sql.gz
          echo "BACKUP_FILE=db_backup_$BACKUP_DATE.sql.gz" >> $GITHUB_ENV

      - name: Configure AWS CLI for Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set default.region us-east-1 # S3 API standard compatibility

      - name: Upload Backup to Cloudflare R2
        env:
          R2_BUCKET: ${{ secrets.AWS_STORAGE_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://$R2_BUCKET/backups/$BACKUP_FILE" --endpoint-url "$R2_ENDPOINT_URL"
